version: '3.9'
services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]
  backend:
    build: ./backend
    environment:
      PORT: 8080
      OLLAMA_URL: http://ollama:11434
      LLAMA_MODEL: llama3
      JWT_SECRET: change-me
    depends_on: [ollama]
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  ollama: {}
