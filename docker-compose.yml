version: '3.9'
services:
  backend:
    build: ./backend
    environment:
      PORT: 8080
      OPENAI_BASE_URL: https://api.llm7.io/v1
      OPENAI_MODEL: openai/gpt-4o
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: change-me
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
